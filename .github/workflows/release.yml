# Release (OpenSpec change add-typed-validation, capability `distribution`): build and test the
# extension for every LadybugDB version × OS × CPU of scripts/release-matrix.sh, upload one
# artifact per entry named with all
# three, and publish only when every entry passed: `publish` needs the whole matrix, so one
# failing entry blocks the release of all of them. The published site has the layout LadybugDB's
# extension installer fetches (scripts/package-extension.sh); each artifact is also attached to
# the GitHub release. The landing page (web/, scripts/build-site.sh) goes on top. Each entry also
# builds the prebuilt Lean archive (scripts/build-lean-archive.sh), tests the extension built from
# it without Lean, and attaches it to the release with SHA256SUMS-lean, for builds without a Lean
# toolchain (ladybugdb/extensions).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(scripts/release-matrix.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.target.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      MARIEN_NEW_PLATFORM: '1'
      ARTIFACT: marien-${{ github.ref_name }}-lbug${{ matrix.ladybug }}-${{ matrix.target.os }}-${{ matrix.target.cpu }}
      # the archive does not depend on the LadybugDB version; publish keeps one per OS and CPU
      LEAN_ARCHIVE: marien-lean-${{ github.ref_name }}-${{ matrix.target.os }}-${{ matrix.target.cpu }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the LadybugDB version of this entry
        run: echo "${{ matrix.ladybug }}" > scripts/ladybug-version
      - name: Install Lean (elan)
        if: ${{ !matrix.target.docker }}
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: OpenSSL 3 for LadybugDB's CMake
        if: ${{ !matrix.target.docker }}
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: Build, check and test (macOS)
        if: ${{ !matrix.target.docker }}
        run: |
          scripts/build-extension.sh strip
          lake test
          scripts/check-deps.sh build/libmarien.lbug_extension
          scripts/check-exports.sh build/libmarien.lbug_extension
          scripts/check-size.sh build/libmarien.lbug_extension
          tests/integration/run.sh
          scripts/test-install.sh build/libmarien.lbug_extension
          mkdir -p out && cp build/libmarien.lbug_extension out/
          scripts/test-lean-archive.sh
          mkdir -p lean && tar -C build/lean-archive -czf "lean/$LEAN_ARCHIVE.tar.gz" include lib
      - name: Build, check and test (Linux, in Docker)
        if: ${{ matrix.target.docker }}
        run: |
          git clone -q --depth 1 --branch "v$(cat scripts/ladybug-version)" https://github.com/LadybugDB/ladybug .deps/ladybug
          tests/linux/docker.sh
          mkdir -p out && cp build/linux/libmarien.lbug_extension out/
          mkdir -p lean && cp build/linux/marien-lean.tar.gz "lean/$LEAN_ARCHIVE.tar.gz"
      - name: Package in the extension-server layout
        run: scripts/package-extension.sh out/libmarien.lbug_extension "dist/$ARTIFACT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lean-${{ env.ARTIFACT }}
          path: lean/${{ env.LEAN_ARCHIVE }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge into one extension server and zip each entry
        run: |
          mkdir -p site
          for d in artifacts/marien-*/; do
            cp -R "$d"/. site/
            (cd "$d" && zip -qr "../../$(basename "$d").zip" .)
          done
          scripts/build-site.sh site "${{ github.ref_name }}"
      - name: The prebuilt Lean archives, one per OS and CPU, with their checksums
        run: |
          for f in artifacts/lean-*/*.tar.gz; do cp -n "$f" . ; done
          sha256sum marien-lean-*.tar.gz > SHA256SUMS-lean
          cat SHA256SUMS-lean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: The published site serves every entry
        run: scripts/check-site.sh "${{ steps.deploy.outputs.page_url }}" site
      - name: GitHub release with every entry
        run: gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --generate-notes *.zip marien-lean-*.tar.gz SHA256SUMS-lean
