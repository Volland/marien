# The tracer bullet (OpenSpec change add-tracer-bullet): build Marien's extension against the
# pinned LadybugDB, check its dependencies, exports and size, run the Lean tests and the
# integration tests against an embedded LadybugDB (liblbug).
name: tracer-bullet

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned LadybugDB
        run: scripts/fetch-ladybug.sh
      - name: Lean tests (engine contract and M1 unit tests)
        run: lake test
      - name: Build the extension
        run: shim/build.sh strip
      - name: Dependencies, exports and size
        run: |
          scripts/check-deps.sh build/libmarien.lbug_extension
          scripts/check-exports.sh build/libmarien.lbug_extension
          scripts/check-size.sh build/libmarien.lbug_extension
      - name: Integration tests
        run: tests/integration/run.sh
