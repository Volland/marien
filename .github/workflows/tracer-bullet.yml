# The tracer bullet, typed validation, and analysis and partitioning (OpenSpec changes
# add-tracer-bullet, add-typed-validation, add-analysis-and-partitioning): build Marien's extension
# against the pinned LadybugDB, check its dependencies, exports and size, run the Lean tests, the
# integration tests and the differential properties against an embedded LadybugDB (liblbug), on
# macOS and on Linux.
name: tracer-bullet

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: OpenSSL 3 for LadybugDB's CMake (Homebrew's default openssl is 4)
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: Fetch pinned LadybugDB
        run: scripts/fetch-ladybug.sh
      - name: Lean tests (engine contract, M1 to M3 unit tests, generator)
        run: lake test
      - name: Build the extension
        run: shim/build.sh strip
      - name: One library, dependencies, exports and size
        run: |
          scripts/check-one-library.sh build
          scripts/check-deps.sh build/libmarien.lbug_extension
          scripts/check-exports.sh build/libmarien.lbug_extension
          scripts/check-size.sh build/libmarien.lbug_extension
      - name: Integration tests
        run: tests/integration/run.sh
      - name: Differential properties and the rejection measure
        run: tests/differential/run.sh 1000
      - name: Download from the extension-server layout and load
        run: scripts/test-install.sh build/libmarien.lbug_extension
      - name: Release workflow shape
        run: scripts/check-release-workflow.sh

  linux-aarch64:
    # The whole Linux leg runs in a fresh Ubuntu 24.04 container (tests/linux/run.sh): Lean tests,
    # the Lean runtime archive rebuilt as PIC (scripts/build-leanrt-pic.sh), the extension built
    # with it, dependency, export and size checks, and the integration tests against liblbug.
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LadybugDB source
        run: git clone -q --depth 1 --branch "v$(cat scripts/ladybug-version)" https://github.com/LadybugDB/ladybug .deps/ladybug
      - name: Build, check and test in Docker
        run: tests/linux/docker.sh
