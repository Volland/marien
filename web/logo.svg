<!-- Marien: a ladybug (Marienkäfer). The left wing case carries a λ, the right one a logical term,
     the tree of f(a, b), whose nodes are the ladybug's spots. Orange, black and white. -->
<svg role="img" aria-label="Marien" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="sticker" x="-12%" y="-12%" width="124%" height="124%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="grown"/>
      <feFlood flood-color="#ffffff"/>
      <feComposite in2="grown" operator="in" result="edge"/>
      <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sticker)">
    <!-- antennae and legs -->
    <g stroke="#111111" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="14">
      <path d="M228 92 C216 62 198 44 170 38"/><path d="M284 92 C296 62 314 44 342 38"/>
      <path d="M104 236 L60 210"/><path d="M88 322 L40 322"/><path d="M110 406 L68 444"/>
      <path d="M408 236 L452 210"/><path d="M424 322 L472 322"/><path d="M402 406 L444 444"/>
    </g>
    <circle cx="170" cy="38" r="13" fill="#111111"/><circle cx="342" cy="38" r="13" fill="#111111"/>
    <!-- the wing cases -->
    <circle cx="256" cy="320" r="168" fill="#ff6a13"/>
    <circle cx="256" cy="320" r="163" fill="none" stroke="#d24a00" stroke-width="10"/>
    <path d="M404 262 A150 150 0 0 0 366 206" stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M256 190 L256 486" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
    <!-- left: λ -->
    <g stroke="#111111" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M132 250 C152 236 168 244 178 266 L226 404"/>
      <path d="M188 314 L134 406"/>
    </g>
    <!-- right: the term f(a, b) -->
    <g stroke="#111111" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M340 264 L300 362"/><path d="M340 264 L384 362"/>
    </g>
    <g fill="#111111">
      <circle cx="340" cy="262" r="28"/>
      <circle cx="300" cy="366" r="23"/>
      <circle cx="384" cy="366" r="23"/>
    </g>
    <g fill="#ffffff" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="700" text-anchor="middle">
      <text x="340" y="271" font-size="26">f</text>
      <text x="300" y="374" font-size="22">a</text>
      <text x="384" y="374" font-size="22">b</text>
    </g>
    <!-- head and pronotum over the wing cases, with the white patches of a real ladybug -->
    <ellipse cx="256" cy="110" rx="56" ry="38" fill="#111111"/>
    <circle cx="234" cy="102" r="7" fill="#ffffff"/><circle cx="278" cy="102" r="7" fill="#ffffff"/>
    <path d="M150 178 C150 136 196 122 256 122 C316 122 362 136 362 178 C362 200 318 210 256 210 C194 210 150 200 150 178 Z" fill="#111111"/>
    <ellipse cx="194" cy="166" rx="24" ry="17" fill="#ffffff"/>
    <ellipse cx="318" cy="166" rx="24" ry="17" fill="#ffffff"/>
  </g>
</svg>
